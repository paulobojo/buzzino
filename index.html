<style>
:root{
  --bg:#FBF3F7; --card:#FFFFFF; --ink:#3A2548; --sub:#8C7E98; --faint:#D4C8DC; --line:#F1E6EE;
  --lav:#C6B7D9; --pink:#F5C9DC; --rose:#F0B2CB;
  --acc:#B0447A; --accSoft:#F5C9DC;
  --go:#1F9D63; --goSoft:#E2F4EA; --hurry:#E08A00; --hurrySoft:#FCEFD6; --run:#D93A2B; --runSoft:#FBE3E0;
  --sh:0 1px 2px rgba(58,37,72,.05), 0 8px 24px rgba(58,37,72,.08);
  --font:-apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
html{overscroll-behavior-y:none; background:var(--bg);}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--font); -webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:calc(env(safe-area-inset-bottom,0px) + 40px);}
button{font:inherit; color:inherit; border:0; background:none; padding:0; cursor:pointer;}
.wrap{max-width:520px; margin:0 auto; padding:0 18px;}
.num{font-variant-numeric:tabular-nums;}

.top{display:flex; align-items:center; justify-content:space-between; padding:22px 2px 20px;}
.logo{font-size:27px; font-weight:800; letter-spacing:-.03em; display:flex; align-items:center; gap:8px;}
.bee{width:40px; height:40px; border-radius:13px; background:linear-gradient(145deg,var(--lav),var(--pink) 60%,var(--rose)); display:flex; align-items:center; justify-content:center; animation:buzz 3s ease-in-out infinite;}
.beeSvg{width:30px; height:30px;}
@keyframes buzz{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-2px) rotate(-4deg)}}
.logo b{color:var(--acc);}
.clock{background:var(--card); box-shadow:var(--sh); border-radius:30px; padding:8px 14px; font-size:14px; font-weight:700; display:flex; align-items:center; gap:7px;}
.clock i{width:7px; height:7px; border-radius:50%; background:var(--rose); animation:blink 2s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

.q{font-size:15px; font-weight:600; color:var(--sub); margin:0 4px 10px;}

/* direction chooser */
.dirs{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.dir{background:var(--card); box-shadow:var(--sh); border-radius:22px; padding:14px 14px 15px; text-align:left; border:2px solid transparent; transition:transform .15s, border-color .2s, background .2s;}
.dir:active{transform:scale(.97);}
.dir .k{font-size:12px; font-weight:600; color:var(--sub);}
.dir .to{font-size:19px; font-weight:800; letter-spacing:-.02em; line-height:1.15; margin-top:3px;}
.dir .fr{font-size:12.5px; color:var(--sub); margin-top:6px;}
.dir.on{background:linear-gradient(145deg,var(--lav),var(--rose)); color:var(--ink); box-shadow:0 10px 24px rgba(176,68,122,.25);}
.dir.on .k, .dir.on .fr{color:rgba(58,37,72,.7);}

/* next bus */
.next{display:block; width:100%; text-align:left; margin-top:16px; border-radius:26px; padding:20px 20px 18px; background:var(--card); box-shadow:var(--sh); transition:transform .15s;}
.next:active{transform:scale(.985);}
.nTop{display:flex; align-items:center; justify-content:space-between; gap:10px;}
.nLbl{font-size:14px; font-weight:700;}
.status{font-size:13px; font-weight:800; padding:6px 11px; border-radius:20px;}
.st-go{background:var(--goSoft); color:var(--go);}
.st-hurry{background:var(--hurrySoft); color:var(--hurry);}
.st-run{background:var(--runSoft); color:var(--run);}
.count{display:flex; align-items:baseline; gap:8px; margin-top:10px;}
.count .p{font-size:18px; font-weight:600; color:var(--sub);}
.count .v{font-size:64px; font-weight:800; letter-spacing:-.045em; line-height:1;}
.count .u{font-size:22px; font-weight:800;}
.journey{display:flex; align-items:center; gap:10px; margin-top:16px; padding-top:16px; border-top:1px solid var(--line);}
.jEnd{flex:0 0 auto;}
.jEnd .t{font-size:24px; font-weight:800; letter-spacing:-.02em;}
.jEnd .s{font-size:12px; color:var(--sub); margin-top:2px; max-width:120px;}
.jEnd.r{text-align:right; margin-left:auto;}
.jMid{flex:1; display:flex; align-items:center; gap:6px; color:var(--faint); min-width:30px;}
.jMid i{flex:1; height:2px; background:repeating-linear-gradient(90deg, var(--faint) 0 5px, transparent 5px 9px);}
.jMid svg{width:26px; height:26px; flex:0 0 auto;}
.jDur{font-size:12px; color:var(--sub); text-align:center; margin-top:10px;}
.tapHint{font-size:12px; color:var(--sub); margin-top:12px; display:flex; align-items:center; gap:6px;}
.tapHint svg{width:14px; height:14px;}
.none .big{font-size:24px; font-weight:800; letter-spacing:-.02em; margin-top:8px;}
.none .sm{font-size:14px; color:var(--sub); margin-top:6px; line-height:1.4;}
.none .sm b{color:var(--ink);}

/* days */
.sec{display:flex; align-items:baseline; justify-content:space-between; margin:30px 4px 12px;}
.sec .t{font-size:21px; font-weight:800; letter-spacing:-.02em;}
.sec .m{font-size:13px; color:var(--sub);}
.seg{position:relative; display:grid; grid-template-columns:1fr 1fr; background:#EFE3EC; border-radius:16px; padding:4px;}
.segThumb{position:absolute; top:4px; bottom:4px; left:4px; width:calc((100% - 8px)/2); border-radius:12px; background:var(--card); box-shadow:0 2px 8px rgba(0,0,0,.1); transition:transform .3s cubic-bezier(.3,1.2,.5,1);}
.segBtn{position:relative; z-index:1; padding:11px 6px; font-size:14px; font-weight:700; color:var(--sub); text-align:center; transition:color .2s;}
.segBtn.active{color:var(--ink);}
.segBtn small{display:block; font-size:10.5px; font-weight:700; color:var(--acc); text-transform:uppercase; letter-spacing:.06em; margin-top:1px;}

/* list */
.list{margin-top:12px; background:var(--card); border-radius:22px; box-shadow:var(--sh); overflow:hidden;}
.row{display:flex; align-items:center; gap:12px; width:100%; text-align:left; padding:15px 18px; border-bottom:1px solid var(--line); position:relative;}
.row:last-child{border-bottom:none;}
.row:active{background:#FBF3F7;}
.row .dep{font-size:22px; font-weight:800; letter-spacing:-.02em; min-width:66px;}
.row .ar{flex:1; font-size:13.5px; color:var(--sub);}
.row .ar b{color:var(--ink); font-weight:700;}
.row .tag{font-size:11.5px; font-weight:800; padding:5px 10px; border-radius:20px; background:var(--accSoft); color:var(--acc); white-space:nowrap;}
.row svg.ch{width:16px; height:16px; color:var(--faint); flex:0 0 auto;}
.row.past .dep, .row.past .ar{opacity:.35;}
.row.nx{background:var(--accSoft);}
.row.nx .dep{color:var(--acc);}
.row.nx::before{content:""; position:absolute; left:0; top:10px; bottom:10px; width:4px; border-radius:0 4px 4px 0; background:var(--acc);}
.pastBtn{width:100%; text-align:center; padding:13px; font-size:13.5px; font-weight:700; color:var(--acc); border-bottom:1px solid var(--line);}
.empty{padding:26px 18px; text-align:center; color:var(--sub); font-size:15px;}

.info{margin-top:20px; background:var(--card); border-radius:18px; box-shadow:var(--sh); padding:15px 16px; font-size:13px; color:var(--sub); line-height:1.5;}
.info b{color:var(--ink);}
.info p{margin:0 0 6px;} .info p:last-child{margin:0;}

/* sheet */
#ov{position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:20; display:flex; align-items:flex-end; justify-content:center; opacity:0; pointer-events:none; transition:opacity .25s;}
#ov.show{opacity:1; pointer-events:auto;}
#sheet{width:100%; max-width:520px; background:var(--bg); border-radius:28px 28px 0 0; padding:10px 0 calc(24px + env(safe-area-inset-bottom,0px)); max-height:86vh; overflow-y:auto; transform:translateY(100%); transition:transform .4s cubic-bezier(.2,.9,.25,1);}
#ov.show #sheet{transform:translateY(0);}
.handle{width:38px; height:5px; border-radius:3px; background:var(--faint); margin:0 auto 14px;}
.sHead{display:flex; justify-content:space-between; align-items:flex-start; padding:0 20px 16px;}
.sHead .k{font-size:13px; font-weight:600; color:var(--sub);}
.sHead .t{font-size:30px; font-weight:800; letter-spacing:-.03em; margin-top:2px;}
.close{width:36px; height:36px; border-radius:50%; background:var(--card); box-shadow:var(--sh); display:flex; align-items:center; justify-content:center;}
.close svg{width:13px; height:13px;}
.stops{margin:0 16px; background:var(--card); border-radius:20px; box-shadow:var(--sh); padding:6px 0; position:relative;}
.sline{position:absolute; left:28px; width:2px; background:var(--line);}
.stop{display:flex; align-items:center; gap:14px; padding:12px 18px 12px 22px; position:relative;}
.sd{width:14px; height:14px; border-radius:50%; background:var(--card); border:3px solid var(--faint); flex:0 0 auto; position:relative; z-index:1;}
.stop.end .sd{border-color:var(--acc); background:var(--rose);}
.stop.me .sd{border-color:var(--acc);}
.sn{flex:1; font-size:15.5px;}
.stop.end .sn{font-weight:800;}
.stop .tm{font-size:15.5px; font-weight:700;}
.stop .you{font-size:10.5px; font-weight:800; color:var(--acc); background:var(--accSoft); padding:3px 7px; border-radius:10px; margin-left:6px; vertical-align:2px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="logo"><span class="bee"><svg class="beeSvg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke="#3A2548" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
  <ellipse cx="27" cy="20" rx="8" ry="11" transform="rotate(-20 27 20)" fill="#FFFFFF"/>
  <ellipse cx="38" cy="20" rx="8" ry="11" transform="rotate(20 38 20)" fill="#FFFFFF"/>
  <path d="M10 38c0-8 7-12 18-12h8c10 0 16 5 16 12s-6 12-16 12h-8C17 50 10 46 10 38z" fill="#F0B2CB"/>
  <path d="M26 26.5v23M36 26v24"/>
  <path d="M52 38h5"/>
  <circle cx="16" cy="36" r="1.6" fill="#3A2548" stroke="none"/>
  <path d="M12 30c-2-4-4-6-7-6M15 28c-1-4-2-7-5-9"/>
</svg></span><span>Buzz<b>ino</b></span></div>
    <div class="clock num"><i></i><span id="clock"></span></div>
  </div>

  <div class="q">Para onde voas hoje?</div>
  <div class="dirs" id="dirs"></div>

  <div id="nextBox"></div>

  <div class="sec"><div class="t">Horários</div><div class="m" id="count"></div></div>
  <div class="seg" id="seg"><div class="segThumb" id="thumb"></div></div>
  <div class="list" id="list"></div>

  <div class="info">
    <p><b>Buzzino</b> · horários da Rodoviária do Oeste, linha Caldas ⇄ Olho Marinho.</p>
    <p><b>Período escolar</b> · em vigor desde 14 de setembro de 2026.</p>
    <p>Nos <b>feriados</b> usa os horários de <b>fim de semana</b>.</p>
    <p>Toca num horário para ver todas as paragens.</p>
  </div>
</div>

<div id="ov">
  <div id="sheet">
    <div class="handle"></div>
    <div class="sHead">
      <div><div class="k" id="sK"></div><div class="t num" id="sT"></div></div>
      <button class="close" id="close" aria-label="Fechar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="stops"><div class="sline" id="sline"></div><div id="stops"></div></div>
  </div>
</div>

<script>
/* Rodoviária do Oeste · Caldas da Rainha ⇄ Peniche · Período escolar (desde 14/09/2026)
   Só o troço Caldas da Rainha ⇄ Olho Marinho. A = dias úteis, B = sáb/dom/feriados. */
const DATA = {
  ida: {
    from:"Caldas da Rainha", to:"Olho Marinho",
    stops:["Caldas da Rainha","Óbidos","A da Gorda","Amoreira","Olho Marinho (cruzamento)","Olho Marinho"],
    trips:[
      {d:"A", t:["07:55","08:12","08:17","08:22","08:27",null]},
      {d:"B", t:["09:30","09:47","09:52","09:57","10:02","10:05"]},
      {d:"A", t:["10:00","10:17","10:22","10:27","10:32",null]},
      {d:"A", t:["12:00","12:17","12:22","12:27","12:32",null]},
      {d:"A", t:["13:30","13:47","13:52","13:57","14:02","14:05"]},
      {d:"B", t:["13:40","13:57","14:02","14:07","14:12","14:15"]},
      {d:"A", t:["16:00","16:17","16:22","16:27","16:32",null]},
      {d:"A", t:["16:30","16:45","16:50","16:55","16:58","17:00"]},
      {d:"A", t:["17:30","17:47","17:52","17:57","18:02","18:05"]},
      {d:"B", t:["17:30","17:47","17:52","17:57","18:02","18:05"]},
      {d:"A", t:["18:35","18:52","18:57","19:02","19:07","19:10"]},
      {d:"A", t:["19:45","20:02","20:07","20:12","20:17",null]}
    ]
  },
  volta: {
    from:"Olho Marinho", to:"Caldas da Rainha",
    stops:["Olho Marinho","Olho Marinho (cruzamento)","Amoreira","A da Gorda","Óbidos","Caldas da Rainha"],
    trips:[
      {d:"A", t:[null,"07:18","07:23","07:28","07:33","07:50"]},
      {d:"B", t:["08:00","08:03","08:08","08:13","08:18","08:35"]},
      {d:"A", t:["08:00","08:03","08:08","08:13","08:18","08:35"]},
      {d:"A", t:[null,"10:33","10:38","10:43","10:48","11:05"]},
      {d:"A", t:[null,"12:48","12:53","12:58","13:03","13:20"]},
      {d:"B", t:["12:50","12:53","12:58","13:03","13:08","13:25"]},
      {d:"A", t:[null,"13:53","13:58","14:03","14:08","14:25"]},
      {d:"A", t:[null,"14:58","15:03","15:08","15:13","15:30"]},
      {d:"A", t:[null,"17:48","17:53","17:58","18:03","18:20"]},
      {d:"A", t:[null,"19:13","19:18","19:23","19:28","19:45"]},
      {d:"B", t:["19:15","19:18","19:23","19:28","19:33","19:50"]}
    ]
  }
};
const DAYS = {A:"Seg. a sexta", B:"Fim de semana"};
const BEE = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke="#3A2548" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">  <ellipse cx="27" cy="20" rx="8" ry="11" transform="rotate(-20 27 20)" fill="#FFFFFF"/>  <ellipse cx="38" cy="20" rx="8" ry="11" transform="rotate(20 38 20)" fill="#FFFFFF"/>  <path d="M10 38c0-8 7-12 18-12h8c10 0 16 5 16 12s-6 12-16 12h-8C17 50 10 46 10 38z" fill="#F0B2CB"/>  <path d="M26 26.5v23M36 26v24"/>  <path d="M52 38h5"/>  <circle cx="16" cy="36" r="1.6" fill="#3A2548" stroke="none"/>  <path d="M12 30c-2-4-4-6-7-6M15 28c-1-4-2-7-5-9"/></svg>`;
const BUS = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="15" rx="3"/><path d="M4 11h16"/><path d="M7 18v2M17 18v2"/></svg>`;
const CH = `<svg class="ch" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>`;
const TAP = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/></svg>`;

let state = { dir: new Date().getHours() < 12 ? "ida" : "volta", day: todayType(), showPast:false };

function todayType(){ const d=new Date().getDay(); return (d===0||d===6) ? "B" : "A"; }
function nowMin(){ const n=new Date(); return n.getHours()*60+n.getMinutes(); }
function toMin(t){ const [h,m]=t.split(":").map(Number); return h*60+m; }
function pad(n){ return String(n).padStart(2,"0"); }
function dur(m){ const h=Math.floor(m/60), r=m%60; return h ? `${h}h${r?pad(r):""}` : `${r} min`; }
/* first/last real times of a trip */
function depOf(tr){ return tr.t.find(x=>x); }
function depStop(dir,tr){ return DATA[dir].stops[tr.t.findIndex(x=>x)]; }
function arrOf(tr){ const t=tr.t; for(let i=t.length-1;i>=0;i--) if(t[i]) return t[i]; }
function arrStop(dir,tr){ const t=tr.t; for(let i=t.length-1;i>=0;i--) if(t[i]) return DATA[dir].stops[i]; }
function tripsFor(dir,day){ return DATA[dir].trips.filter(x=>x.d===day).sort((a,b)=>toMin(depOf(a))-toMin(depOf(b))); }

function renderDirs(){
  const box = document.getElementById("dirs");
  box.innerHTML = ["ida","volta"].map(k=>{
    const d = DATA[k];
    return `<button class="dir ${state.dir===k?"on":""}" data-k="${k}"><div class="k">Ir para</div><div class="to">${d.to}</div><div class="fr">saindo de ${d.from.replace(" da Rainha","")}</div></button>`;
  }).join("");
  box.querySelectorAll(".dir").forEach(b=> b.onclick=()=>{ if(state.dir===b.dataset.k) return; state.dir=b.dataset.k; state.showPast=false; if(navigator.vibrate) navigator.vibrate(8); render(); });
}

function renderNext(){
  const box = document.getElementById("nextBox");
  const list = tripsFor(state.dir, todayType());
  const now = nowMin();
  const tr = list.find(x=>toMin(depOf(x))>=now);
  if(!tr){
    // find next day's first
    const base = new Date(); let label="", first=null;
    for(let k=1;k<=3;k++){ const d=new Date(base); d.setDate(base.getDate()+k); const tt=(d.getDay()===0||d.getDay()===6)?"B":"A"; const l=tripsFor(state.dir,tt); if(l.length){ first=l[0]; label = k===1?"amanhã":["domingo","segunda","terça","quarta","quinta","sexta","sábado"][d.getDay()]; break; } }
    box.innerHTML = `<div class="next none"><div class="nTop"><span class="nLbl">Próximo autocarro</span></div>
      <div class="big">Hoje já não há mais</div>
      <div class="sm">${first ? `O primeiro de <b>${label}</b> sai às <b>${depOf(first)}</b> de ${depStop(state.dir,first)}.` : ""}</div></div>`;
    return;
  }
  const dep = depOf(tr), arr = arrOf(tr), d = toMin(dep)-now;
  const [cls,txt] = d<=5 ? ["st-run","Corre!"] : d<=15 ? ["st-hurry","Despacha-te"] : ["st-go","Tens tempo"];
  const h=Math.floor(d/60), m=d%60;
  const big = d===0 ? `<span class="v">Agora!</span>` : h ? `<span class="p">daqui a</span><span class="v num">${h}h${m?pad(m):""}</span>` : `<span class="p">daqui a</span><span class="v num">${m}</span><span class="u">min</span>`;
  box.innerHTML = `<button class="next" id="nextBtn">
    <div class="nTop"><span class="nLbl">Próximo autocarro</span><span class="status ${cls}">${txt}</span></div>
    <div class="count">${big}</div>
    <div class="journey">
      <div class="jEnd"><div class="t num">${dep}</div><div class="s">Sai de ${depStop(state.dir,tr)}</div></div>
      <div class="jMid"><i></i>${BEE}<i></i></div>
      <div class="jEnd r"><div class="t num">${arr}</div><div class="s">Chegas a ${arrStop(state.dir,tr)}</div></div>
    </div>
    <div class="jDur">Viagem de ${dur(toMin(arr)-toMin(dep))}</div>
  </button>`;
  document.getElementById("nextBtn").onclick = ()=> openStops(tr);
}

function renderSeg(){
  const seg = document.getElementById("seg");
  seg.querySelectorAll(".segBtn").forEach(b=>b.remove());
  ["A","B"].forEach(d=>{
    const b=document.createElement("button");
    b.className="segBtn"+(state.day===d?" active":"");
    b.innerHTML = DAYS[d] + (d===todayType() ? "<small>hoje</small>" : "");
    b.onclick=()=>{ state.day=d; state.showPast=false; renderList(); };
    seg.appendChild(b);
  });
  document.getElementById("thumb").style.transform = `translateX(${state.day==="A"?0:100}%)`;
}

function renderList(){
  renderSeg();
  const list = tripsFor(state.dir, state.day);
  const box = document.getElementById("list");
  document.getElementById("count").textContent = `${list.length} por dia`;
  if(!list.length){ box.innerHTML = `<div class="empty">Não há autocarros neste dia.</div>`; return; }
  const now = nowMin(), isToday = state.day===todayType();
  const nx = isToday ? list.findIndex(x=>toMin(depOf(x))>=now) : -1;
  const pastN = isToday ? (nx===-1 ? list.length : nx) : 0;
  let html = "";
  if(pastN>0 && pastN<list.length) html += `<button class="pastBtn" id="pastBtn">${state.showPast?"Esconder":"Ver"} os ${pastN} que já passaram</button>`;
  list.forEach((tr,i)=>{
    const past = i<pastN;
    if(past && !state.showPast && pastN<list.length) return;
    const dep=depOf(tr), arr=arrOf(tr);
    html += `<button class="row ${past?"past":""} ${i===nx?"nx":""}" data-i="${i}">
      <span class="dep num">${dep}</span>
      <span class="ar">chegas às <b class="num">${arr}</b></span>
      ${i===nx ? `<span class="tag">Próximo</span>` : ""}${CH}</button>`;
  });
  box.innerHTML = html;
  const pb=document.getElementById("pastBtn"); if(pb) pb.onclick=()=>{ state.showPast=!state.showPast; renderList(); };
  box.querySelectorAll(".row").forEach(r=> r.onclick=()=> openStops(list[+r.dataset.i]));
}

function render(){ renderDirs(); renderNext(); renderList(); }

function closeSheet(){ document.getElementById("ov").classList.remove("show"); }
function openStops(tr){
  const D = DATA[state.dir];
  document.getElementById("sK").textContent = `${D.from} → ${D.to}`;
  document.getElementById("sT").textContent = `${depOf(tr)} → ${arrOf(tr)}`;
  const idx = tr.t.map((t,i)=>t?i:-1).filter(i=>i>=0);
  const first = idx[0], last = idx[idx.length-1];
  document.getElementById("stops").innerHTML = idx.map(i=>{
    const isEnd = i===first || i===last;
    const isOM = /Olho Marinho/.test(D.stops[i]) && !isEnd;
    return `<div class="stop ${isEnd?"end":""} ${isOM?"me":""}"><span class="sd"></span><span class="sn">${D.stops[i]}</span><span class="tm num">${tr.t[i]}</span></div>`;
  }).join("");
  document.getElementById("ov").classList.add("show");
  requestAnimationFrame(()=>{
    const r=document.querySelectorAll("#stops .sd"); if(r.length<2) return;
    const top=document.querySelector(".stops").getBoundingClientRect().top;
    const a=r[0].getBoundingClientRect(), b=r[r.length-1].getBoundingClientRect(), l=document.getElementById("sline");
    l.style.top=(a.top+a.height/2-top)+"px"; l.style.height=(b.top-a.top)+"px";
  });
}
document.getElementById("close").onclick = closeSheet;
document.getElementById("ov").addEventListener("click", e=>{ if(e.target.id==="ov") closeSheet(); });
(function(){
  const s=document.getElementById("sheet"); let y0=null, dy=0;
  s.addEventListener("touchstart",e=>{ if(s.scrollTop<=0){ y0=e.touches[0].clientY; dy=0; s.style.transition="none"; } },{passive:true});
  s.addEventListener("touchmove",e=>{ if(y0===null) return; dy=Math.max(0,e.touches[0].clientY-y0); s.style.transform=`translateY(${dy}px)`; },{passive:true});
  s.addEventListener("touchend",()=>{ if(y0===null) return; s.style.transition=""; s.style.transform=""; if(dy>90) closeSheet(); y0=null; });
})();

function tick(){ const n=new Date(); document.getElementById("clock").textContent=`${pad(n.getHours())}:${pad(n.getMinutes())}`; }
tick(); render();
setInterval(()=>{ tick(); renderNext(); renderList(); }, 30000);
</script>
</body>
</html>
